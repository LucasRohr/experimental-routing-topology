# ============================================================================
# Autor: Lucas Rohr Carreno
# TOPOLOGIA DE REDES - TRABALHO I - GRAU A
# Objetivo: 5 Roteadores distribuídos em 3 Sistemas Autônomos (AS 100, 200, 300)
# Tipo de Topologia: Triangular (AS 100 e AS 200 conectados ao AS 300)
#
# Plataforma de Roteamento: FRRouting (FRR) - https://frrouting.org/
#   - FRRouting (FRR) é um fork direto e ativamente mantido do Quagga,
#     sendo padrão atual para orquestração de roteamento em containers, com foco em sistemas Linux.
#   - Possui otimização de desempenho e suporte a protocolos de roteamento como BGP, RIP, OSPF, entre outros.
# ============================================================================

services:
  # ---------------------------------------------------------
  # SISTEMA AUTÔNOMO 100 (AS 100) - Roteadores 1 e 2
  # ---------------------------------------------------------
  router1-as100:
    image: quay.io/frrouting/frr:8.5.0
    platform: linux/arm64 # Força a arquitetura ARM64 nativa do Apple Silicon
    container_name: router1
    # 'privileged' é obrigatório para que o container Docker possa alterar as 
    # tabelas de roteamento do kernel Linux (namespaces de rede virtuais)
    privileged: true
    sysctls:
      # Habilita o encaminhamento de pacotes IPv4 no kernel, 
      # transformando o container em um roteador funcional
      - net.ipv4.ip_forward=1
    networks:
      net-as100-internal:
        # Host .1 reservado para a ponte Docker
        ipv4_address: 10.100.0.2 # Faixa de rede interna do AS100 usando Classe A com máscara /24
      net-bgp-100-300:
        # Host .1 reservado para a ponte Docker
        ipv4_address: 172.25.13.2 # Enlace BGP com AS300 (Classe B Privada, /29)

  router2-as100:
    image: quay.io/frrouting/frr:8.5.0
    platform: linux/arm64
    container_name: router2
    privileged: true
    sysctls:
      - net.ipv4.ip_forward=1
    networks:
      net-as100-internal:
        ipv4_address: 10.100.0.3   # Conectado ao Router 1 via rede interna usando Classe A com máscara /24
      net-bgp-100-200:
        # Host .1 reservado para a ponte Docker
        ipv4_address: 172.25.12.2 # Enlace BGP com AS200 (Classe B Privada, /29)

  # ---------------------------------------------------------
  # SISTEMA AUTÔNOMO 200 (AS 200) - Roteadores 3 e 4
  # ---------------------------------------------------------
  router3-as200:
    image: quay.io/frrouting/frr:8.5.0
    platform: linux/arm64
    container_name: router3
    privileged: true
    sysctls:
      - net.ipv4.ip_forward=1
    networks:
      net-as200-internal:
        ipv4_address: 10.200.0.2 # Faixa de rede interna do AS200 usando Classe A com máscara /24
      net-bgp-100-200:
        # Host .1 reservado para a ponte Docker
        ipv4_address: 172.25.12.3 # Enlace de borda com o AS100 (Classe B Privada, /29)

  router4-as200:
    image: quay.io/frrouting/frr:8.5.0
    platform: linux/arm64
    container_name: router4
    privileged: true
    sysctls:
      - net.ipv4.ip_forward=1
    networks:
      net-as200-internal:
        ipv4_address: 10.200.0.3   # Conectado ao Router 3 via rede interna usando Classe A com máscara /24
      net-bgp-200-300:
        # Host .1 reservado para a ponte Docker
        ipv4_address: 172.25.23.2 # Enlace de borda com o AS300 (Classe B Privada, /29)

  # ---------------------------------------------------------
  # SISTEMA AUTÔNOMO 300 (AS 300) - Roteador 5
  # ---------------------------------------------------------
  router5-as300:
    image: quay.io/frrouting/frr:8.5.0
    platform: linux/arm64
    container_name: router5
    privileged: true
    sysctls:
      - net.ipv4.ip_forward=1
    networks:
      net-as300-lan:
        ipv4_address: 10.30.0.2   # Simula uma rede local de destino final
      net-bgp-200-300:
        ipv4_address: 172.25.23.3 # Enlace de borda com o AS200
      net-bgp-100-300:
        ipv4_address: 172.25.13.3 # Caminho alternativo de volta para o AS100

# ============================================================================
# TOPOLOGIA FÍSICA - DEFINIÇÃO DAS SUB-REDES FÍSICAS (ENLACES)
# ============================================================================
networks:
  # --- Redes Internas (IGP) - Utilizando Classe A com CIDR /24 ---
  net-as100-internal:
    ipam:
      config:
        - subnet: 10.100.0.0/24
  net-as200-internal:
    ipam:
      config:
        - subnet: 10.200.0.0/24
  net-as300-lan:
    ipam:
      config:
        - subnet: 10.30.0.0/24

  # --- Enlaces Externos BGP (EGP) - Classe B (172.25.x.x) com CIDR /29 ---
  # O uso do CIDR /29 fornece 6 IPs utilizáveis, permitindo o IP .1 para o 
  # host Docker e os IPs .2 e .3 para os roteadores das extremidades
  net-bgp-100-200: # Configuração entre AS100 e AS200
    ipam:
      config:
        - subnet: 172.25.12.0/29
  net-bgp-200-300: # Configuração entre AS200 e AS300
    ipam:
      config:
        - subnet: 172.25.23.0/29
  net-bgp-100-300: # Configuração entre AS100 e AS300
    ipam:
      config:
        - subnet: 172.25.13.0/29